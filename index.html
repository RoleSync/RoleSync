    <script>
      // Suppress noisy unhandled errors originating from injected browser extensions (e.g. Web Vitals / profilers / Loom)
      (function() {
        function isExtensionError(msg, stack, file) {
          var str = ((msg || '') + ' ' + (stack || '') + ' ' + (file || '')).toLowerCase();
          return str.indexOf('starttime') !== -1 || 
                 str.indexOf('reportallchanges') !== -1 || 
                 str.indexOf('chrome-extension') !== -1;
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.error ? event.error.stack : '', event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event.reason?.message, event.reason?.stack, '')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
